name: CI/CD

# dev  -> checks, then deploys to the Netlify dev preview (https://dev--<site>.netlify.app)
# main -> checks, then deploys to the Netlify production site
# Pull requests into either branch run the checks only.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Site checks (files, offline cache, manifest, secrets)
        run: python3 .github/scripts/check_site.py

      - name: JavaScript syntax
        run: |
          shopt -s globstar
          for f in sw.js clips.js clips/*.js js/**/*.js; do
            node --check "$f" || exit 1
          done
          echo "All JavaScript parses"

  test:
    name: Tests (unit, accessibility in every display mode, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Unit and content tests (writes sample PDF and Word reports)
        run: npm run test:unit
        env:
          REPORT_DIR: ${{ runner.temp }}/reports

      - name: Generated PDF and Word reports are valid
        run: python3 .github/scripts/check_reports.py "$RUNNER_TEMP/reports"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (axe in every display mode, phone and laptop, offline)
        run: npm run test:e2e

      - name: Keep the report if browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'dev preview' }}
    needs: [check, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage site files
        run: rsync -a --exclude='.*' --exclude='netlify.toml' --exclude='node_modules' --exclude='native' --exclude='tests' --exclude='docs' --exclude='README.md' --exclude='package*.json' --exclude='*.config.js' --exclude='test-results' --exclude='playwright-report' ./ _site/

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # The site (project) ID is not secret, so a repository variable is fine too.
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID }}
          # Only used to say where a misplaced token is; never passed to Netlify.
          TOKEN_IN_VARS: ${{ vars.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            if [ "$TOKEN_IN_VARS" = "true" ]; then
              echo "::error::NETLIFY_AUTH_TOKEN is saved as a Variable. Delete it from the Variables tab and add it on the Secrets tab (Settings > Secrets and variables > Actions)"
            else
              echo "::error::NETLIFY_AUTH_TOKEN is missing. Add it as a repository secret: Settings > Secrets and variables > Actions > Secrets > New repository secret"
            fi
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is missing. Add your Netlify Project ID as a repository secret with this exact name"
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            target="--prod"
          else
            target="--alias=dev"
          fi
          npx --yes netlify-cli@17.38.1 deploy --dir=_site $target \
            --message="$GITHUB_REF_NAME @ ${GITHUB_SHA::7}" --json > deploy.json
          url=$(python3 -c "import json; d=json.load(open('deploy.json')); print(d.get('url') or d['deploy_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android app (test build)
    needs: [check, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the Android app
        run: ./native/build-android.sh

      - name: Keep the app for download
        uses: actions/upload-artifact@v4
        with:
          name: thinking-lab-android-${{ github.ref_name }}
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
