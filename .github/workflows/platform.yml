name: Platform

# The React platform (apps/, packages/, supabase/): checks on every push and pull request that touches it,
# plus test builds of the Android and iOS apps. Pushes to the platform branch also publish the new app at its own
# Netlify address (app--<site>.netlify.app), connected to Supabase through the repository variables VITE_SUPABASE_URL
# and VITE_SUPABASE_ANON_KEY. The live site and its pipeline (ci-cd.yml) are untouched.
on:
  push:
    paths: ["apps/**", "packages/**", "supabase/**", "tools/**", "js/content/**", "css/app.css", "package*.json", "tsconfig.platform.json", "vitest.platform.config.mts", "eslint.config.mjs", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "supabase/**", "tools/**", "js/content/**", "css/app.css", "package*.json", "tsconfig.platform.json", "vitest.platform.config.mts", "eslint.config.mjs", ".github/workflows/platform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, module boundaries, tests (database rules included), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lessons and styles match the live site
        run: |
          node tools/export-content.mjs
          git diff --exit-code -- packages/content/data packages/ui/src apps/app/src/modules/avatar/legacy-avatar.js || { echo "::error::Run node tools/export-content.mjs and commit the result"; exit 1; }
      - run: npm run platform:types
      - run: npm run platform:lint
      - run: npm run platform:bounds
      - run: npm run platform:test
      - name: Build, and check the download stays small for low-end phones
        run: |
          npm run app:build
          size=$(cat apps/app/dist/assets/index-*.js | gzip -c | wc -c)
          echo "Main bundle: $((size / 1024)) KB gzipped" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -lt 150000 ] || { echo "::error::Main bundle is $((size / 1024)) KB gzipped; the budget is 150 KB"; exit 1; }

  preview:
    name: Publish the new app (app--<site>.netlify.app)
    needs: checks
    if: github.event_name == 'push' && github.ref_name == 'platform'
    runs-on: ubuntu-latest
    environment:
      # The same environment as the live site's dev preview, so it gets the same Netlify secrets.
      name: development
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build, connected to Supabase
        env:
          # The project URL and publishable key are public by design (every visitor's browser gets them); they are kept
          # as repository variables, not in the code. Without them the app is built in demo mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || echo "::warning::VITE_SUPABASE_URL isn't set (Settings > Secrets and variables > Actions > Variables), so this build is in demo mode"
          npm run app:build
      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID }}
        run: |
          [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "::error::NETLIFY_AUTH_TOKEN isn't available to this job. Add it as a repository secret (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          [ -n "$NETLIFY_SITE_ID" ] || { echo "::error::NETLIFY_SITE_ID isn't available to this job. Add it as a repository secret or variable"; exit 1; }
          npx --yes netlify-cli@17.38.1 deploy --dir=apps/app/dist --alias=app \
            --message="platform @ ${GITHUB_SHA::7}" --json > deploy.json
          url=$(python3 -c "import json; d=json.load(open('deploy.json')); print(d.get('deploy_url') or d['url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "New app published at $url" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android app (test build)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: apps/app/native/build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: thinking-lab-platform-android
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iOS app (simulator build)
    needs: checks
    runs-on: macos-15
    # GitHub's Mac runners are sometimes unavailable ("not acquired by Runner"). That says nothing about our code, so
    # it doesn't fail the run; check this job's own result, and use "Re-run jobs" when Macs are free again.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: apps/app/native/build.sh ios
